<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALVUFINANCEIRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login" class="login">
    <form id="loginForm" class="login-card">
      <div class="logo"><span class="logo-mark">A</span>ALVUFINANCEIRO</div>
      <h1>Acesso administrativo</h1>
      <p>Controle financeiro inteligente da sua agência.</p>
      <div class="field">
        <label>Senha de acesso</label>
        <input id="password" type="password" placeholder="Digite sua senha" required>
      </div>
      <button class="btn primary" type="submit">Entrar no sistema</button>
      <div id="loginError" class="error"></div>
    </form>
  </section>

  <section id="shell" class="shell hide">
    <aside id="side" class="side">
      <div class="logo"><span class="logo-mark">A</span>ALVU</div>
      <nav class="menu" id="menu">
        <button type="button" data-page="dashboard" class="active">▦ Dashboard</button>
        <button type="button" data-page="clients">◉ Empresas e cobranças</button>
        <button type="button" data-page="debts">▤ Dívidas</button>
        <button type="button" data-page="transactions">↕ Movimentações</button>
        <button type="button" data-page="settings">⚙ Configuração</button>
      </nav>
      <div class="side-foot">
        <button type="button" class="btn light" style="width:100%" onclick="logout()">Sair</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div style="display:flex;align-items:center;gap:10px">
          <button type="button" class="btn light mobile" onclick="toggleMenu()">☰</button>
          <div>
            <h2 id="pageTitle">Dashboard</h2>
            <small id="syncText">Conectando...</small>
          </div>
        </div>
        <button type="button" class="btn light small" onclick="loadData(true)">↻ Atualizar</button>
      </header>
      <div id="view" class="content"></div>
    </main>
  </section>

  <div id="modal" class="modal hide"></div>
  <div id="loading" class="loading hide">
    <div class="loader-card">
      <div class="spinner"></div>
      <b id="loadingText">Carregando...</b>
    </div>
  </div>
  <div id="toast" class="toast hide"></div>

  <script src="script.js" defer></script>
</body>
</html>
